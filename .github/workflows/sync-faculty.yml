name: Sync BUBT Info Hub Data

on:
  schedule:
    # Run every Sunday at 02:00 UTC (8:00 AM BST)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab anytime!

jobs:
  sync:
    name: Sync BUBT Directory & Notices
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run BUBT Sync Script
        run: node scripts/sync-bubt-data.js

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/images/
          if git diff --staged --quiet; then
            echo "No changes detected in BUBT directory."
          else
            git commit -m "chore: auto-sync latest BUBT faculty & circulars [skip ci]"
            git push
          fi
